<style>
:root{
  --bg:#EEF1F4;--card:#FFFFFF;--text:#1A2233;--muted:#5B6477;--line:#D8DDE5;
  --head:#16264A;--headText:#FFFFFF;--yellow:#F2C230;--yellowInk:#3A2C00;--green:#1E8A4E;--star:#E0A800;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1422;--card:#172036;--text:#E8ECF3;--muted:#9AA3B5;--line:#2A3450;--head:#0A1224;--green:#2BA864;--star:#F2C230;
}}
:root[data-theme="dark"]{--bg:#0E1422;--card:#172036;--text:#E8ECF3;--muted:#9AA3B5;--line:#2A3450;--head:#0A1224;--green:#2BA864;--star:#F2C230}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}

.top{background:var(--head);color:var(--headText);padding:36px 18px 0;position:relative}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:11px;flex:none;display:block}
.brand h1{margin:0;font-size:1.55rem;font-weight:800;font-stretch:112%;letter-spacing:-.01em;line-height:1.05}
.brand p{margin:2px 0 0;font-size:.85rem;opacity:.75}
.controls{display:grid;gap:10px;margin-top:22px;padding-bottom:18px}
.field{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:0 12px;height:46px}
.field svg{width:18px;height:18px;stroke:currentColor;opacity:.7;flex:none}
.field input,.field select{flex:1;min-width:0;background:transparent;border:0;outline:0;height:100%;color:var(--headText);font-size:1rem}
.field select option{color:#1A2233}
.field input::placeholder{color:rgba(255,255,255,.6)}
.ruler{height:14px;background:var(--yellow);
  background-image:repeating-linear-gradient(90deg,var(--head) 0 1.5px,transparent 1.5px 10px),repeating-linear-gradient(90deg,var(--head) 0 1.5px,transparent 1.5px 50px);
  background-size:100% 5px,100% 9px;background-repeat:no-repeat;background-position:0 0,0 0}

.note{margin:14px 18px 0;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note b{background:var(--yellow);color:var(--yellowInk);padding:1px 6px;border-radius:4px;font-weight:700;font-size:.72rem}
.acct{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.lnk{background:none;border:0;padding:4px 0;color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}

main{padding:14px 18px 40px}
h2{font-size:1.15rem;font-weight:800;font-stretch:108%;margin:10px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:118px}
.cat .ic{width:40px;height:40px;border-radius:10px;background:var(--head);display:grid;place-items:center}
.cat .ic svg{width:22px;height:22px;stroke:var(--yellow)}
.cat strong{display:block;font-size:1.02rem;font-weight:700;line-height:1.15}
.cat span{font-size:.8rem;color:var(--muted)}
.cat:active{transform:scale(.98)}

.bar{display:flex;align-items:center;gap:6px;padding:20px 12px 14px;background:var(--head);color:var(--headText);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.back{display:inline-flex;align-items:center;gap:4px;background:transparent;border:0;color:var(--headText);padding:8px 8px;border-radius:8px;font-weight:600}
.back svg{width:20px;height:20px;stroke:currentColor}
.bar .t{font-weight:800;font-stretch:108%;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.item .info{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.item .name{font-weight:700;font-size:1.02rem}
.item .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.top1{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;background:var(--yellow);color:var(--yellowInk);padding:2px 7px;border-radius:5px}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.9rem;margin-top:4px}
.stars i{font-style:normal;color:var(--star);letter-spacing:1px}
.stars small{color:var(--muted);font-weight:500}
.call{flex:none;width:52px;height:52px;border-radius:50%;background:var(--green);border:0;display:grid;place-items:center}
.call svg{width:24px;height:24px;stroke:#fff}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

.prof{background:var(--head);color:var(--headText);padding:6px 18px 22px}
.prof h1{margin:0;font-size:1.8rem;font-weight:800;font-stretch:112%;line-height:1.1}
.prof .kat{display:inline-block;margin:8px 6px 0 0;background:var(--yellow);color:var(--yellowInk);font-weight:700;font-size:.8rem;padding:3px 8px;border-radius:5px}
.big{display:flex;align-items:baseline;gap:10px;margin-top:16px}
.big b{font-size:2.6rem;font-weight:800;font-stretch:115%;line-height:1}
.big i{font-style:normal;color:var(--yellow);font-size:1.2rem;letter-spacing:2px}
.big small{opacity:.75}
.facts{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.92rem}
.facts li{display:flex;gap:8px}
.facts span{opacity:.7;min-width:92px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px 0}
.btn{height:52px;border-radius:12px;border:0;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px;stroke:currentColor}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--card);border:1.5px solid var(--text);color:var(--text)}
.btn.yellow{background:var(--yellow);color:var(--yellowInk);width:100%}
a.btn{text-decoration:none}
.mejl{font-size:1.1rem;font-weight:700;user-select:all;word-break:break-all}
.btn.del{background:transparent;color:#C0392B;width:100%;height:44px;margin-top:8px}
.btn:disabled{opacity:.6;cursor:wait}
.phone{padding:10px 18px 0;font-size:.85rem;color:var(--muted)}

.sec{padding:22px 18px 0}
.tags{display:grid;gap:10px}
.tagrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter div{height:100%;background:var(--green)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rev .h{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.rev .h b{font-weight:700}
.rev .h span{color:var(--muted)}
.rev .s{color:var(--star);letter-spacing:1px;margin:4px 0}
.rev p{margin:4px 0 0}
.rev .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted)}
.mine{border-color:var(--green)}
.rev .rep{background:none;border:0;color:var(--muted);font-size:.78rem;padding:8px 0 0;text-decoration:underline;text-underline-offset:2px}
.ac.flag{border-color:#C0392B}

.partneri{margin-top:22px}
.partneri .ph{display:flex;align-items:center;gap:8px}
.partneri .ph::before{content:"";width:14px;height:4px;border-radius:2px;background:var(--yellow);flex:none}
.partneri .ph h2{margin:0;flex:1;font-size:.92rem;color:var(--muted)}
.partneri .sp{font-size:.66rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.partneri .pp{margin:3px 0 8px;font-size:.75rem;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ptile{height:56px;border-radius:10px;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;padding:6px;text-decoration:none;text-align:center;font-weight:700;font-size:.68rem;line-height:1.1;overflow:hidden}
.ptile img{max-width:100%;max-height:100%;object-fit:contain}
.ptile:active{transform:scale(.97)}
.plogo{width:100%;max-width:220px;height:110px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;margin:0 0 12px;overflow:hidden}
.plogo img{max-width:90%;max-height:90%;object-fit:contain}
.boje{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.boje button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line)}
.boje button[aria-pressed="true"]{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.foot{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center}
.foot p{margin:0;flex:1;font-size:.9rem}
.foot p b{display:block;font-size:1rem}
.foot button{flex:none;background:var(--head);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.adm{margin-top:14px}
.adminTop{position:sticky;top:0;z-index:6;background:var(--head)}
.adminTop .bar{position:static}
.tabs{display:flex;gap:8px;padding:0 12px 12px}
.tab{flex:1;text-align:center;padding:10px 8px;border-radius:10px;color:var(--headText);text-decoration:none;font-weight:700;font-size:.95rem;background:rgba(255,255,255,.08)}
.tab.on{background:var(--yellow);color:var(--yellowInk)}
.stati{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:.75rem;color:var(--muted)}
.st b{display:block;font-size:1.45rem;color:var(--text);font-stretch:110%}
.krtraka{display:flex;gap:8px;margin-bottom:10px}
.krtraka input{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:.95rem}
.krtraka select,.krtraka button{height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-size:.85rem}
button.ac{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.badge.crv{background:#C0392B;color:#fff}
.badge.zel{background:var(--green);color:#fff}
.legal{margin:20px 0 0;text-align:center;font-size:.82rem;color:var(--muted)}
.legal a,.sheet .sub a,.sagl a{color:inherit}
.ac{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ac.off{opacity:.65}
.ac .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ac .h b{font-size:1.02rem}
.ac .h span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.ac .m{font-size:.85rem;color:var(--muted);margin-top:2px}
.ac p{margin:6px 0 0;font-size:.92rem}
.ab{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ab button,.ab a{height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.ab svg{width:16px;height:16px;stroke:currentColor}
.ab .ok{background:var(--green);border-color:var(--green);color:#fff}
.ab .no{color:#C0392B}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--text);margin-left:6px;vertical-align:middle}
.sub2{font-size:.85rem;color:var(--muted);margin:-6px 0 12px}

.sheetBg{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;z-index:20;touch-action:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .25s ease;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.open .sheetBg{display:block}
.open .sheet{transform:none}
.sheet h3{margin:0 0 4px;font-size:1.2rem;font-weight:800;font-stretch:108%}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.pick{display:flex;gap:6px;margin-bottom:6px}
.pick button{width:48px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:1.5rem;color:var(--line);line-height:1}
.pick button.on{color:var(--star);border-color:var(--star)}
.pickLbl{font-size:.85rem;color:var(--muted);min-height:1.2em;margin-bottom:14px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toggles button{border:1.5px solid var(--line);background:transparent;border-radius:20px;padding:8px 12px;font-size:.88rem}
.toggles button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.sheet label{display:block;font-size:.85rem;font-weight:600;margin:0 0 6px}
.sheet textarea,.sheet input:not([type=checkbox]),.sheet select{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;margin-bottom:12px;font-size:1rem}
.sheet textarea{min-height:90px;resize:vertical}
.sheet select{height:46px}
.sheet label.sagl{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:.88rem;margin:4px 0 12px}
.sagl input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--green)}
.status{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:14px;font-size:.92rem}
.status b{display:block;margin-bottom:4px}
.btn.google{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--text)}
.btn.google svg{width:20px;height:20px;stroke:none}
.ili{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem;margin:14px 0}
.ili::before,.ili::after{content:"";flex:1;height:1px;background:var(--line)}
.alt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:12px;font-size:.88rem}
.hint{font-size:.82rem;color:var(--muted);margin:-6px 0 12px}
.err{color:#C0392B;font-size:.85rem;min-height:1.2em;margin:-4px 0 8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);width:max-content;transition:.2s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Ikonice, mesta, kategorije i zaglavlje početne: izvršava se odmah, pre učitavanja Firebase-a,
// pa se naslov i pretraga vide bez čekanja (modul ispod koristi iste podatke)
const IC={
 struja:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 voda:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
 krecenje:'<path d="M4 4h13v5H4z"/><path d="M17 6.5h3v5.5h-8v3"/><path d="M11 15h2v6h-2z"/>',
 keramika:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
 stolar:'<path d="M3 17 17 3l4 4L7 21H3z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/>',
 gips:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M12 3v18"/><path d="M7.5 6.5h.01M16.5 6.5h.01M7.5 12h.01M16.5 12h.01M7.5 17.5h.01M16.5 17.5h.01"/>',
 teski:'<path d="M3 5h18v14H3z"/><path d="M3 10h18M3 15h18M9 5v5M15 10v5M9 15v4"/>',
 klima:'<path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17"/>',
 bravar:'<path d="M6 11h12v10H6z"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 krov:'<path d="M3 12 12 4l9 8"/><path d="M5 10v10h14V10"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 pin:'<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
 back:'<path d="M15 5 8 12l7 7"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'
};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

const MESTA=["Stara Pazova","Nova Pazova","Novi Banovci","Stari Banovci","Banovci-Dunav","Belegiš","Surduk","Golubinci","Vojka","Krnješevci"];
const KAT=[
 {id:'struja',n:'Struja',s:'Električar'},
 {id:'voda',n:'Voda',s:'Vodoinstalater'},
 {id:'krecenje',n:'Krečenje',s:'Moler, farbar'},
 {id:'keramika',n:'Keramika',s:'Keramičar'},
 {id:'stolar',n:'Stolarija',s:'Stolar'},
 {id:'gips',n:'Gipsarski radovi',s:'Gipsar'},
 {id:'teski',n:'Teški radovi',s:'Iskop, rušenje, beton'},
 {id:'klima',n:'Klima i grejanje',s:'Serviser'},
 {id:'bravar',n:'Bravarija i limarija',s:'Bravar, limar'},
 {id:'krov',n:'Krovovi',s:'Krovopokrivač'}
];
function htmlZaglavlja(){return `<header class="top">

// Logo: smanji na radnu veličinu, iseci prazan okvir (providno ili skoro belo), pa smanji na 320 px
function isecenLogo(img){const r=Math.min(1,1000/Math.max(img.width,img.height)),w=Math.round(img.width*r),h=Math.round(img.height*r);
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
 let d;try{d=g.getImageData(0,0,w,h).data}catch(_){return c}
 const prazno=i=>d[i+3]<16||(d[i]>240&&d[i+1]>240&&d[i+2]>240);
 let x0=w,y0=h,x1=-1,y1=-1;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(!prazno((y*w+x)*4)){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<0)return c;
 const p=Math.round(Math.max(x1-x0,y1-y0)*.04);x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(h-1,y1+p);
 const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}
function smanjiLogo(fajl){return new Promise((ok,ne)=>{const img=new Image(),url=URL.createObjectURL(fajl);
 img.onload=()=>{const izvor=isecenLogo(img),k=Math.min(1,320/Math.max(izvor.width,izvor.height)),c=document.createElement('canvas');
  c.width=Math.round(izvor.width*k);c.height=Math.round(izvor.height*k);c.getContext('2d').drawImage(izvor,0,0,c.width,c.height);URL.revokeObjectURL(url);
  let d=c.toDataURL('image/webp',.85);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/png');ok(d)};
 img.onerror=()=>{URL.revokeObjectURL(url);ne(new Error('slika'))};img.src=url})}
function formaPartnera(x){x=x||{boja:BOJE[0][0],tekst:BOJE[0][1],red:(AP.length?Math.max(...AP.map(p=>p.red))+1:1)};
 let logo=x.logo||'',boja=x.boja,tekst=x.tekst;
 const pregled=()=>{const el=document.getElementById('plogo');el.style.background=boja;el.style.color=tekst;el.innerHTML=logo?`<img src="${logo}" alt="">`:'<span style="font-weight:700">'+esc(document.getElementById('paIme').value||'Logo')+'</span>'};
 sh.innerHTML=`<h3 id="sheetTitle">${x.id?'Izmena partnera':'Novi partner'}</h3>
 <label for="paIme">Naziv firme</label><input id="paIme" maxlength="40" value="${esc(x.ime||'')}">
 <label for="paLink">Link ka njihovom sajtu</label><input id="paLink" type="url" inputmode="url" maxlength="300" placeholder="https://..." value="${esc(x.link||'')}">
 <label>Logo</label><div class="plogo" id="plogo"></div>
 <input id="paFajl" type="file" accept="image/*" style="margin-bottom:6px">
 ${logo?'<button class="lnk" id="paBezLoga" type="button" style="margin-bottom:12px">Ukloni logo (prikazuje se naziv)</button>':''}
 <label>Boja pločice</label><div class="boje">${BOJE.map(([b,t],i)=>`<button type="button" data-i="${i}" aria-label="Boja ${i+1}" aria-pressed="${b===boja}" style="background:${b}"></button>`).join('')}</div>
 <label for="paRed">Redosled (manji broj = bliže početku)</label><input id="paRed" type="number" inputmode="numeric" min="1" max="99" value="${x.red}">
 <label class="sagl"><input type="checkbox" id="paAkt" ${x.id?(x.a?'checked':''):'checked'}><span>Prikaži na početnoj strani</span></label>
 <div class="err" id="err"></div><button class="btn yellow" id="save">${x.id?'Sačuvaj':'Dodaj partnera'}</button>`;
 const $=id=>document.getElementById(id),err=$('err'),save=$('save');
 pregled();$('paIme').oninput=pregled;
 $('paFajl').onchange=async e=>{const f=e.target.files[0];if(!f)return;err.textContent='';
  try{logo=await smanjiLogo(f);if(logo.length>400000){logo='';err.textContent='Slika je prevelika i posle smanjivanja. Probaj drugu.'}pregled()}
  catch(_){err.textContent='Ne mogu da pročitam ovu sliku. Probaj PNG ili JPG.'}};
 if($('paBezLoga'))$('paBezLoga').onclick=()=>{logo='';pregled()};
 sh.querySelectorAll('.boje button').forEach(b=>b.onclick=()=>{[boja,tekst]=BOJE[+b.dataset.i];sh.querySelectorAll('.boje button').forEach(y=>y.setAttribute('aria-pressed',y===b));pregled()});
 save.onclick=async()=>{const ime=$('paIme').value.trim(),link=$('paLink').value.trim(),red=Number($('paRed').value);
  const g=ime.length<2?'Upiši naziv firme.':link&&!/^https?:\/\/\S+\.\S+/i.test(link)?'Link mora da počne sa https:// (npr. https://metalflex.rs).'
   :!Number.isInteger(red)||red<1||red>99?'Redosled je broj od 1 do 99.':'';
  if(g){err.textContent=g;return}
  const d={ime,link,logo,boja,tekst,redosled:red,aktivan:$('paAkt').checked};
  save.disabled=true;save.textContent='Čuvam…';
  try{await setDoc(x.id?doc(db,'partneri',x.id):doc(collection(db,'partneri')),d);zatvori();toast(x.id?'Partner je sačuvan.':'Partner je dodat.')}
  catch(e){console.error(e);err.textContent='Čuvanje nije uspelo. Da li su objavljena nova pravila baze?';save.disabled=false;save.textContent=x.id?'Sačuvaj':'Dodaj partnera'}};
 otvoriProzor()}

const pokusaj=async(f,ok)=>{try{await f();if(ok)toast(ok)}catch(e){console.error(e);toast('Nije uspelo. Proveri internet vezu i probaj ponovo.')}};
const adm={
 izmeniPrijavu(uid){const p=PR.find(x=>x.uid===uid);if(!p)return;
  izmeniForma('Izmena prijave',p,x=>updateDoc(doc(db,'prijave',uid),x))},
 odobri(uid){const p=PR.find(x=>x.uid===uid);if(!p)return;
  if(!p.telefon){toast('Prijava nema broj telefona.');return}
  if(!confirm(`Odobriti: ${p.ime}?\nPojaviće se u aplikaciji sa brojem ${p.telefon}.`))return;
  const b=writeBatch(db),mid='u_'+uid;
  b.set(doc(db,'majstori',mid),{ime:p.ime,kategorija:p.kategorija,mesta:p.mesta,iskustvo:p.iskustvo,opis:p.opis,telefon:p.telefon,aktivan:true,prijava:uid});
  b.update(doc(db,'prijave',uid),{status:'odobren',majstor:mid});
  pokusaj(()=>b.commit(),`${p.ime} je odobren i vidi se u aplikaciji.`)},
 odbij(uid){const p=PR.find(x=>x.uid===uid);if(!p||!confirm(`Odbiti prijavu: ${p.ime}?`))return;
  pokusaj(()=>updateDoc(doc(db,'prijave',uid),{status:'odbijen'}),'Prijava je odbijena.')},
 vratiPrijavu(uid){pokusaj(()=>updateDoc(doc(db,'prijave',uid),{status:'na_cekanju'}),'Prijava je vraćena na čekanje.')},
 obrisiPrijavu(uid){if(!confirm('Trajno obrisati ovu prijavu?'))return;
  pokusaj(()=>deleteDoc(doc(db,'prijave',uid)),'Prijava je obrisana.')},
 // Rezervna kopija: sve iz baze u jedan JSON fajl koji se preuzima na uređaj (ne ide nigde drugde)
 async kopija(){const btn=document.getElementById('kopijaBtn'),tekst=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Pripremam kopiju…'}
  const cist=v=>v&&typeof v.toDate==='function'?v.toDate().toISOString()
   :Array.isArray(v)?v.map(cist):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,cist(x)])):v;
  const sve=async q=>(await getDocs(q)).docs;
  try{
   const [maj,oce,par,pri,doj]=await Promise.all([sve(collection(db,'majstori')),sve(collectionGroup(db,'ocene')),
    sve(collection(db,'partneri')),sve(collection(db,'prijave')),sve(collectionGroup(db,'dojave'))]);
   const ocenePo={};oce.forEach(d=>{const mid=d.ref.parent.parent.id;(ocenePo[mid]=ocenePo[mid]||[]).push({id:d.id,...cist(d.data())})});
   const podaci={aplikacija:'Majstori Pazova',napravljeno:new Date().toISOString(),
    majstori:maj.map(d=>({id:d.id,...cist(d.data()),ocene:ocenePo[d.id]||[]})),
    partneri:par.map(d=>({id:d.id,...cist(d.data())})),
    prijave:pri.map(d=>({id:d.id,...cist(d.data())})),
    dojave:doj.map(d=>({putanja:d.ref.path,...cist(d.data())}))};
   const datum=new Date().toISOString().slice(0,10),
    blob=new Blob([JSON.stringify(podaci,null,1)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download=`majstori-pazova-kopija-${datum}.json`;document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),5000);
   toast(`Kopija preuzeta: ${podaci.majstori.length} majstora, ${oce.length} ocena, ${podaci.partneri.length} partnera.`)}
  catch(e){console.error(e);toast('Kopija nije uspela. Proveri internet vezu i probaj ponovo.')}
  finally{if(btn){btn.disabled=false;btn.textContent=tekst}}},
 korisnik(uid){detaljiKorisnika(uid)},
 blokiraj(uid,da){const k=(KR||[]).find(x=>x.uid===uid);if(!k||k.admin||uid===user.uid)return;
  pokusaj(()=>da?setDoc(doc(db,'blokirani',uid),{vreme:serverTimestamp(),email:k.email}):deleteDoc(doc(db,'blokirani',uid)),
   da?`${k.ime||k.email} je blokiran i ne može da ocenjuje.`:`${k.ime||k.email} je odblokiran.`)},
 async obrisiKorisnika(uid){const k=(KR||[]).find(x=>x.uid===uid);if(!k||k.admin||uid===user.uid)return;
  if(!confirm(`Obriši korisnika ${k.ime||k.email}?\n\nDa li ste sigurni? Ova radnja se ne može poništiti.\nNjegove ocene ostaju kao „Anonimni korisnik”.`))return;
  try{const r=await adminApi({akcija:'obrisi',uid});
   KR=KR.filter(x=>x.uid!==uid);krOtvoren=null;zatvori();osveziKorisnike();
   toast(`Korisnik je obrisan. Anonimizovano ocena: ${r.anonimizovanoOcena}.`)}
  catch(e){console.error(e);toast('Brisanje nije uspelo: '+(e.message||'greška'))}},
 partner(id){formaPartnera(id?AP.find(x=>x.id===id):null)},
 prikaziPartnera(id,vidljiv){pokusaj(()=>updateDoc(doc(db,'partneri',id),{aktivan:vidljiv}),vidljiv?'Partner se prikazuje.':'Partner je sakriven.')},
 obrisiPartnera(id){const x=AP.find(y=>y.id===id);if(!x||!confirm(`Trajno obrisati partnera ${x.ime}?`))return;
  pokusaj(()=>deleteDoc(doc(db,'partneri',id)),'Partner je obrisan.')},
 izmeniMajstora(id){const m=AM.find(x=>x.id===id);if(!m)return;
  izmeniForma('Izmena: '+m.n,{ime:m.n,telefon:m.t,kategorija:m.k,kategorije:m.ks,mesta:m.r,iskustvo:m.g,opis:m.o,mesto:m.mesto},
   x=>updateDoc(doc(db,'majstori',id),x),{admin:true})},
 // Admin dodaje majstora direktno: odmah odobren, bez veze sa bilo kojim nalogom
 dodaj(){izmeniForma('Novi majstor',{},x=>setDoc(doc(collection(db,'majstori')),{...x,aktivan:true}),
  {admin:true,traziTel:true,saglasnost:true,dugme:'Dodaj majstora',uspeh:'Majstor je dodat i vidi se u aplikaciji.'})},
 // Briše prijavu (sa emailom naloga) i skida vezu majstora sa nalogom; bez ocena majstor dobija i novi ID
 odvezi(uid,mid){const p=PR.find(x=>x.uid===uid),m=AM.find(x=>x.id===(mid||(p&&p.majstor)));
  if(!p&&!m)return;
  if(!confirm(`Odvezati nalog${p&&p.email?' '+p.email:''} od majstora ${m?m.n:p.ime}?\nMajstor ostaje u aplikaciji, a prijava se briše.`))return;
  const b=writeBatch(db);
  if(m&&!oceneOd(m).length){
   const x={ime:m.n,kategorija:m.k,kategorije:m.ks,mesta:m.r,iskustvo:m.g,opis:m.o,telefon:m.t,aktivan:m.a};
   if(m.mesto)x.mesto=m.mesto;
   b.set(doc(collection(db,'majstori')),x);b.delete(doc(db,'majstori',m.id))}
  else if(m)b.update(doc(db,'majstori',m.id),{prijava:deleteField()});
  b.delete(doc(db,'prijave',uid));
  pokusaj(()=>b.commit(),'Nalog je odvezan. Majstor ostaje u aplikaciji.')},
 // Trajno briše majstora sa ocenama i dojavama (i prijavu, ako je bio vezan za nalog)
 obrisiMajstora(id){const m=AM.find(x=>x.id===id);if(!m)return;
  const n=oceneOd(m).length;
  if(!confirm(`Trajno obrisati majstora ${m.n}${n?` i ${n} ${ocenaRec(n)}`:''}?\nOvo ne može da se vrati. Ako samo hoćeš da ga skloniš iz aplikacije, izaberi „Sakrij”.`))return;
  const b=writeBatch(db);
  oceneOd(m).forEach(r=>b.delete(doc(db,'majstori',id,'ocene',r.uid)));
  DO.filter(d=>d.mid===id).forEach(d=>b.delete(d.ref));
  if(m.prijava)b.delete(doc(db,'prijave',m.prijava));
  b.delete(doc(db,'majstori',id));
  pokusaj(()=>b.commit(),`${m.n} je obrisan.`)},
 prikazi(id,vidljiv){pokusaj(()=>updateDoc(doc(db,'majstori',id),{aktivan:vidljiv}),vidljiv?'Majstor se ponovo vidi u aplikaciji.':'Majstor je sakriven.')},
 // Briše recenziju zajedno sa njenim dojavama (Firestore ih ne briše sam)
 obrisiRecenziju(mid,uid){if(!confirm('Trajno obrisati ovu recenziju?'))return;
  const b=writeBatch(db);
  if(uid)b.delete(doc(db,'majstori',mid,'ocene',uid));
  DO.filter(d=>d.mid===mid&&d.ruid===uid).forEach(d=>b.delete(d.ref));
  pokusaj(()=>b.commit(),'Recenzija je obrisana.')},
 ubaciNove(){const novi=noviZaUbacivanje();if(!novi.length)return;
  if(!confirm(`Ubaciti ${novi.length} majstora u aplikaciju?\n\n${novi.map(n=>n.ime).join('\n')}`))return;
  const b=writeBatch(db);
  novi.forEach(({id,...d})=>b.set(doc(db,'majstori',id),{...d,aktivan:true}));
  pokusaj(()=>b.commit(),`Ubačeno ${novi.length} majstora.`)},
 uRedu(mid,uid){const b=writeBatch(db);
  DO.filter(d=>d.mid===mid&&d.ruid===uid).forEach(d=>b.delete(d.ref));
  pokusaj(()=>b.commit(),'Prijava je skinuta, recenzija ostaje.')}
};

async function prijaviKomentar(mid,ruid){
 if(!(await prijava()))return;
 if(ruid===user.uid)return;
 if(jaBlokiran){toast('Tvoj nalog je blokiran. Ne možeš da ostavljaš ocene ni prijave.');return}
 if(!confirm('Prijaviti ovaj komentar administratoru kao neprimeren ili lažan?'))return;
 try{await setDoc(doc(db,'majstori',mid,'ocene',ruid,'dojave',user.uid),{uid:user.uid,vreme:serverTimestamp()});
  toast('Hvala! Komentar je prijavljen administratoru.')}
 catch(e){console.error(e);toast(e.code==='permission-denied'?'Već si prijavio ovaj komentar.':'Prijava nije uspela. Probaj ponovo.')}}

// Kontakt: mailto ne radi na računaru bez podešenog mejl programa, zato nudimo i kopiranje adrese
const KONTAKT='majstoripazova@gmail.com';
function kontakt(){
 sh.innerHTML=`<h3 id="sheetTitle">Kontakt</h3><p class="sub">Za pitanja, predloge i zahteve u vezi sa podacima piši nam na:</p>
 <div class="status"><span class="mejl">${KONTAKT}</span></div>
 <a class="btn yellow" href="mailto:${KONTAKT}">Otvori mejl aplikaciju</a>
 <button class="btn del" id="kop" style="color:var(--text)">Kopiraj adresu</button>`;
 document.getElementById('kop').onclick=async()=>{
  try{await navigator.clipboard.writeText(KONTAKT);toast('Adresa je kopirana.')}
  catch(e){const r=document.createRange();r.selectNodeContents(sh.querySelector('.mejl'));const x=getSelection();x.removeAllRanges();x.addRange(r);toast('Adresa je označena, kopiraj je sa Ctrl+C.')}};
 otvoriProzor()}
// Prozor (donji jezičak) zaključava skrol stranice ispod; radi i na iPhone Safariju (position:fixed na body)
let zakljucanY=null;
function otvoriProzor(){
 if(zakljucanY===null){zakljucanY=window.scrollY;const b=document.body.style;
  b.position='fixed';b.top=`-${zakljucanY}px`;b.left='0';b.right='0';b.width='100%';b.overflow='hidden'}
 document.body.classList.add('open');
 if(document.getElementById('sheetTitle'))sh.setAttribute('aria-labelledby','sheetTitle');else sh.removeAttribute('aria-labelledby')}
// Posle zatvaranja sadržaj prozora se uklanja: zaostalo polje za šifru navodi Chrome da pretragu
// smatra poljem za korisničko ime (ikonica naloga u pretrazi)
let tajmerPraznjenja=0;
function skloniProzor(){
 document.body.classList.remove('open');krOtvoren=null;
 clearTimeout(tajmerPraznjenja);tajmerPraznjenja=setTimeout(()=>{if(!document.body.classList.contains('open')){sh.innerHTML='';sh.removeAttribute('aria-labelledby')}},300);
 if(zakljucanY!==null){const y=zakljucanY,b=document.body.style;zakljucanY=null;
  b.position=b.top=b.left=b.right=b.width=b.overflow='';window.scrollTo(0,y)}}
function zatvori(){skloniProzor();if(cekaPrijavu){const f=cekaPrijavu;cekaPrijavu=null;f(false)}}
document.getElementById('sheetBg').onclick=zatvori;
document.addEventListener('keydown',e=>{if(e.key==='Escape')zatvori()});
