<style>
:root{
  --bg:#EEF1F4;--card:#FFFFFF;--text:#1A2233;--muted:#5B6477;--line:#D8DDE5;
  --head:#16264A;--headText:#FFFFFF;--yellow:#F2C230;--yellowInk:#3A2C00;--green:#1E8A4E;--star:#E0A800;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1422;--card:#172036;--text:#E8ECF3;--muted:#9AA3B5;--line:#2A3450;--head:#0A1224;--green:#2BA864;--star:#F2C230;
}}
:root[data-theme="dark"]{--bg:#0E1422;--card:#172036;--text:#E8ECF3;--muted:#9AA3B5;--line:#2A3450;--head:#0A1224;--green:#2BA864;--star:#F2C230}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}

.top{background:var(--head);color:var(--headText);padding:20px 18px 0;position:relative}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:10px;background:var(--yellow);display:grid;place-items:center;flex:none}
.mark svg{width:24px;height:24px;stroke:var(--head)}
.brand h1{margin:0;font-size:1.55rem;font-weight:800;font-stretch:112%;letter-spacing:-.01em;line-height:1.05}
.brand p{margin:2px 0 0;font-size:.85rem;opacity:.75}
.controls{display:grid;gap:10px;margin-top:18px;padding-bottom:18px}
.field{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:0 12px;height:46px}
.field svg{width:18px;height:18px;stroke:currentColor;opacity:.7;flex:none}
.field input,.field select{flex:1;min-width:0;background:transparent;border:0;outline:0;height:100%;color:var(--headText);font-size:1rem}
.field select option{color:#1A2233}
.field input::placeholder{color:rgba(255,255,255,.6)}
.ruler{height:14px;background:var(--yellow);
  background-image:repeating-linear-gradient(90deg,var(--head) 0 1.5px,transparent 1.5px 10px),repeating-linear-gradient(90deg,var(--head) 0 1.5px,transparent 1.5px 50px);
  background-size:100% 5px,100% 9px;background-repeat:no-repeat;background-position:0 0,0 0}

.note{margin:14px 18px 0;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note b{background:var(--yellow);color:var(--yellowInk);padding:1px 6px;border-radius:4px;font-weight:700;font-size:.72rem}
.acct{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.lnk{background:none;border:0;padding:4px 0;color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}

main{padding:14px 18px 40px}
h2{font-size:1.15rem;font-weight:800;font-stretch:108%;margin:10px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:118px}
.cat .ic{width:40px;height:40px;border-radius:10px;background:var(--head);display:grid;place-items:center}
.cat .ic svg{width:22px;height:22px;stroke:var(--yellow)}
.cat strong{display:block;font-size:1.02rem;font-weight:700;line-height:1.15}
.cat span{font-size:.8rem;color:var(--muted)}
.cat:active{transform:scale(.98)}

.bar{display:flex;align-items:center;gap:6px;padding:14px 12px;background:var(--head);color:var(--headText);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.back{display:inline-flex;align-items:center;gap:4px;background:transparent;border:0;color:var(--headText);padding:8px 8px;border-radius:8px;font-weight:600}
.back svg{width:20px;height:20px;stroke:currentColor}
.bar .t{font-weight:800;font-stretch:108%;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.item .info{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.item .name{font-weight:700;font-size:1.02rem}
.item .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.top1{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;background:var(--yellow);color:var(--yellowInk);padding:2px 7px;border-radius:5px}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.9rem;margin-top:4px}
.stars i{font-style:normal;color:var(--star);letter-spacing:1px}
.stars small{color:var(--muted);font-weight:500}
.call{flex:none;width:52px;height:52px;border-radius:50%;background:var(--green);border:0;display:grid;place-items:center}
.call svg{width:24px;height:24px;stroke:#fff}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

.prof{background:var(--head);color:var(--headText);padding:6px 18px 22px}
.prof h1{margin:0;font-size:1.8rem;font-weight:800;font-stretch:112%;line-height:1.1}
.prof .kat{display:inline-block;margin-top:8px;background:var(--yellow);color:var(--yellowInk);font-weight:700;font-size:.8rem;padding:3px 8px;border-radius:5px}
.big{display:flex;align-items:baseline;gap:10px;margin-top:16px}
.big b{font-size:2.6rem;font-weight:800;font-stretch:115%;line-height:1}
.big i{font-style:normal;color:var(--yellow);font-size:1.2rem;letter-spacing:2px}
.big small{opacity:.75}
.facts{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.92rem}
.facts li{display:flex;gap:8px}
.facts span{opacity:.7;min-width:92px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px 0}
.btn{height:52px;border-radius:12px;border:0;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px;stroke:currentColor}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--card);border:1.5px solid var(--text);color:var(--text)}
.btn.yellow{background:var(--yellow);color:var(--yellowInk);width:100%}
.btn.del{background:transparent;color:#C0392B;width:100%;height:44px;margin-top:8px}
.btn:disabled{opacity:.6;cursor:wait}
.phone{padding:10px 18px 0;font-size:.85rem;color:var(--muted)}

.sec{padding:22px 18px 0}
.tags{display:grid;gap:10px}
.tagrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter div{height:100%;background:var(--green)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rev .h{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.rev .h b{font-weight:700}
.rev .h span{color:var(--muted)}
.rev .s{color:var(--star);letter-spacing:1px;margin:4px 0}
.rev p{margin:4px 0 0}
.rev .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted)}
.mine{border-color:var(--green)}
.rev .rep{background:none;border:0;color:var(--muted);font-size:.78rem;padding:8px 0 0;text-decoration:underline;text-underline-offset:2px}
.ac.flag{border-color:#C0392B}

.foot{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center}
.foot p{margin:0;flex:1;font-size:.9rem}
.foot p b{display:block;font-size:1rem}
.foot button{flex:none;background:var(--head);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.adm{margin-top:14px}
.legal{margin:20px 0 0;text-align:center;font-size:.82rem;color:var(--muted)}
.legal a,.sheet .sub a,.sagl a{color:inherit}
.ac{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ac.off{opacity:.65}
.ac .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ac .h b{font-size:1.02rem}
.ac .h span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.ac .m{font-size:.85rem;color:var(--muted);margin-top:2px}
.ac p{margin:6px 0 0;font-size:.92rem}
.ab{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ab button,.ab a{height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.ab svg{width:16px;height:16px;stroke:currentColor}
.ab .ok{background:var(--green);border-color:var(--green);color:#fff}
.ab .no{color:#C0392B}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--text);margin-left:6px;vertical-align:middle}
.sub2{font-size:.85rem;color:var(--muted);margin:-6px 0 12px}

.sheetBg{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .25s ease;max-height:92vh;overflow-y:auto}
.open .sheetBg{display:block}
.open .sheet{transform:none}
.sheet h3{margin:0 0 4px;font-size:1.2rem;font-weight:800;font-stretch:108%}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.pick{display:flex;gap:6px;margin-bottom:6px}
.pick button{width:48px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:1.5rem;color:var(--line);line-height:1}
.pick button.on{color:var(--star);border-color:var(--star)}
.pickLbl{font-size:.85rem;color:var(--muted);min-height:1.2em;margin-bottom:14px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toggles button{border:1.5px solid var(--line);background:transparent;border-radius:20px;padding:8px 12px;font-size:.88rem}
.toggles button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.sheet label{display:block;font-size:.85rem;font-weight:600;margin:0 0 6px}
.sheet textarea,.sheet input:not([type=checkbox]),.sheet select{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;margin-bottom:12px;font-size:1rem}
.sheet textarea{min-height:90px;resize:vertical}
.sheet select{height:46px}
.sheet label.sagl{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:.88rem;margin:4px 0 12px}
.sagl input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--green)}
.status{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:14px;font-size:.92rem}
.status b{display:block;margin-bottom:4px}
.err{color:#C0392B;font-size:.85rem;min-height:1.2em;margin:-4px 0 8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:.9rem;max-width:calc(100% - 32px);width:max-content;transition:.2s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function avg(m){const r=oceneOd(m);return r.length?r.reduce((s,x)=>s+x.r,0)/r.length:0}
const poOceni=(a,b)=>(avg(b)-avg(a))||(oceneOd(b).length-oceneOd(a).length)||a.n.localeCompare(b.n,'sr');

function kad(v){const d=(Date.now()-v)/864e5;
 if(d<1)return 'danas';if(d<2)return 'juče';if(d<7)return `pre ${Math.floor(d)} dana`;
 if(d<30){const n=Math.floor(d/7);return n===1?'pre nedelju dana':`pre ${n} nedelje`}
 if(d<365){const n=Math.floor(d/30);return n===1?'pre mesec dana':`pre ${n} ${n<5?'meseca':'meseci'}`}
 const n=Math.floor(d/365);return n===1?'pre godinu dana':`pre ${n} ${n<5?'godine':'godina'}`}

onSnapshot(collectionGroup(db,'ocene'),s=>{

 catch(e){

  console.error(e);
  toast(e.code==='auth/popup-blocked'?'Pregledač je blokirao prozor za prijavu. Dozvoli iskačuće prozore i probaj ponovo.'
   :e.code==='auth/unauthorized-domain'?'Ovaj sajt još nije dozvoljen u Firebase-u (Authorized domains).'
   :'Prijava nije uspela. Probaj ponovo.');
  return false}}

 if(!user&&!(await prijava()))return;
 const moja=oceneOd(m).find(x=>x.uid===user.uid);

 sh.innerHTML=`<h3 id="sheetTitle">${moja?'Izmeni ocenu':'Oceni'}: ${esc(m.n)}</h3><p class="sub">Tvoja ocena pomaže komšijama da nađu dobrog majstora. Vide je svi. <a href="privatnost.html" target="_blank">Privatnost</a></p>

 <div class="err" id="err"></div>
 <button class="btn yellow" id="save">${moja?'Sačuvaj izmenu':'Sačuvaj ocenu'}</button>
 ${moja?'<button class="btn del" id="del">Obriši moju ocenu</button>':''}`;
 const err=document.getElementById('err'),save=document.getElementById('save');
 sh.querySelectorAll('#pick button').forEach(b=>b.onclick=()=>{z=+b.dataset.v;sh.querySelectorAll('#pick button').forEach(x=>x.classList.toggle('on',+x.dataset.v<=z));document.getElementById('pl').textContent=OPIS[z];err.textContent=''});
 sh.querySelectorAll('.toggles button').forEach(b=>b.onclick=()=>{const t=b.dataset.t;tg.has(t)?tg.delete(t):tg.add(t);b.setAttribute('aria-pressed',tg.has(t))});
 save.onclick=async()=>{

  body:new URLSearchParams({'form-name':'nova-prijava',subject:'Nova prijava majstora - Majstori Pazova',
   ime:d.ime,kategorija:(kat(d.kategorija)||{}).s||d.kategorija,mesta:d.mesta.join(', '),
   admin:location.origin+'/#/admin'}).toString()}).catch(e=>console.error(e))}

async function upisSe(){
 if(!user&&!(await prijava()))return;
 let p=null;
 try{const s=await getDoc(doc(db,'prijave',user.uid));if(s.exists())p=s.data()}
 catch(e){console.error(e);toast('Ne mogu da proverim prijavu. Probaj ponovo.');return}
 if(p){
  const [nas,txt]=STATUS[p.status]||STATUS.na_cekanju;
  sh.innerHTML=`<h3 id="sheetTitle">Tvoja prijava</h3>
  <div class="status"><b>${nas}</b>${txt}</div>
  <p class="sub">${esc(p.ime)} · ${esc((kat(p.kategorija)||{}).s||'')} · ${esc(p.telefon)}</p>
  <button class="btn yellow" id="ok">U redu</button>`;
  document.getElementById('ok').onclick=zatvori;
  document.body.classList.add('open');return}
 sh.innerHTML=`<h3 id="sheetTitle">Upiši se kao majstor</h3><p class="sub">Besplatno. Pre objave te pozovemo da proverimo podatke.</p>
 ${poljaHtml({ime:user.displayName||''})}
 <label class="sagl"><input type="checkbox" id="pSag"><span>Saglasan sam da se moje ime, broj telefona, mesta u kojima radim i opis javno objave u aplikaciji Majstori Pazova (<a href="privatnost.html" target="_blank">politika privatnosti</a>).</span></label>
 <div class="err" id="err"></div>
 <button class="btn yellow" id="save">Pošalji prijavu</button>`;
 const procitaj=poveziPolja({}),err=document.getElementById('err'),save=document.getElementById('save');
 save.onclick=async()=>{
  let [d,g]=procitaj(true);
  if(!g&&!document.getElementById('pSag').checked)g='Da bismo te objavili, potrebna je tvoja saglasnost.';
  if(g){err.textContent=g;return}
  err.textContent='';save.disabled=true;save.textContent='Šaljem…';
  try{
   await setDoc(doc(db,'prijave',user.uid),{...d,saglasnost:true,status:'na_cekanju',uid:user.uid,email:user.email,vreme:serverTimestamp()});
   obavestiAdmina(d);
   zatvori();toast('Prijava je poslata. Javićemo ti se pre objave.')
  }catch(e){console.error(e);err.textContent='Slanje nije uspelo. Proveri internet vezu i probaj ponovo.';save.disabled=false;save.textContent='Pošalji prijavu'}};
 document.body.classList.add('open');setTimeout(()=>document.getElementById('pIme').focus(),50)}

// ---------- Admin ----------
const telLink=t=>t?`<a href="tel:${esc(t)}">${svg('phone')}Pozovi</a>`:'';
function admin(nav){
 if(!jeAdmin()){app.innerHTML=`<div class="bar"><button class="back" onclick="location.hash='#/'">${svg('back')}Nazad</button><div class="t">Admin</div></div>
  <main><div class="empty">Ova stranica je samo za administratora.${user?'':'<div class="adm"><button class="btn yellow" onclick="prijava()">Prijavi se</button></div>'}</div></main>`;return}
 const cek=naCekanju().sort((a,b)=>a.v-b.v),odb=PR.filter(p=>p.status==='odbijen');
 const majstori=[...AM].sort((a,b)=>(b.a-a.a)||a.n.localeCompare(b.n,'sr'));
 const imeM=id=>(AM.find(m=>m.id===id)||{}).n||'(obrisan majstor)';
 const recenzije=Object.entries(OC).flatMap(([mid,l])=>l.map(r=>({...r,mid}))).sort((a,b)=>b.v-a.v);
 const prijavaKartica=(p,odbijena)=>`<div class="ac ${odbijena?'off':''}"><div class="h"><b>${esc(p.ime)}</b><span>${kad(p.v)}</span></div>
  <div class="m">${esc((kat(p.kategorija)||{}).s||'')} · ${p.iskustvo} god. iskustva · ${esc(p.telefon)}</div>
  <div class="m">${esc((p.mesta||[]).join(', '))}</div><div class="m">${esc(p.email||'')}</div>
  <p>${esc(p.opis)}</p>
  <div class="ab">${telLink(p.telefon)}${odbijena
   ?`<button onclick="adm.vratiPrijavu('${p.uid}')">Vrati na čekanje</button><button class="no" onclick="adm.obrisiPrijavu('${p.uid}')">Obriši</button>`
   :`<button onclick="adm.izmeniPrijavu('${p.uid}')">Izmeni</button><button class="ok" onclick="adm.odobri('${p.uid}')">Odobri</button><button class="no" onclick="adm.odbij('${p.uid}')">Odbij</button>`}</div></div>`;
 const dojave=prijavljene().map(g=>({...g,r:(OC[g.mid]||[]).find(x=>x.uid===g.ruid)}));
 const recKartica=(r,mid,broj,ruid)=>`<div class="ac ${broj?'flag':''}"><div class="h"><b>${esc(imeM(mid))}</b><span>${r?kad(r.v):''}</span></div>
  ${r?`<div class="m"><span style="color:var(--star)">${zv(r.r)}</span> · ${esc(r.a)}</div>${r.c?`<p>${esc(r.c)}</p>`:''}`:'<div class="m">(recenzija je već obrisana)</div>'}
  ${broj?`<div class="m" style="color:#C0392B">Prijavljeno ${broj}×</div>`:''}
  <div class="ab"><button class="no" onclick="adm.obrisiRecenziju('${mid}','${ruid}')">Obriši recenziju</button>${broj?`<button onclick="adm.uRedu('${mid}','${ruid}')">U redu je</button>`:''}</div></div>`;
 app.innerHTML=`<div class="bar"><button class="back" onclick="history.length>1?history.back():location.hash='#/'">${svg('back')}Nazad</button><div class="t">Admin</div></div>
 <main>
 ${dojave.length?`<h2>Prijavljene recenzije<span class="badge">${dojave.length}</span></h2>
 <p class="sub2">„U redu je” skida prijavu, a recenzija ostaje.</p>
 ${dojave.map(g=>recKartica(g.r,g.mid,g.refs.length,g.ruid)).join('')}<div style="height:16px"></div>`:''}
 <h2>Prijave na čekanju<span class="badge">${cek.length}</span></h2>
 ${cek.length?cek.map(p=>prijavaKartica(p,false)).join(''):'<div class="empty">Nema novih prijava.</div>'}
 <h2 style="margin-top:28px">Majstori<span class="badge">${majstori.filter(m=>m.a).length} aktivnih</span></h2>
 <p class="sub2">Sakriven majstor se ne vidi u aplikaciji, ali ostaje u bazi zajedno sa ocenama.</p>
 ${majstori.map(m=>`<div class="ac ${m.a?'':'off'}"><div class="h"><b>${esc(m.n)}${m.a?'':'<span class="badge">sakriven</span>'}</b><span>${oceneOd(m).length} ${ocenaRec(oceneOd(m).length)}</span></div>
  <div class="m">${esc((kat(m.k)||{}).s||m.k)} · ${esc(m.r.join(', '))}</div><div class="m">${m.t?esc(m.t):'bez telefona'}</div>
  <div class="ab">${telLink(m.t)}<button onclick="adm.izmeniMajstora('${m.id}')">Izmeni</button><button onclick="adm.prikazi('${m.id}',${!m.a})">${m.a?'Sakrij':'Prikaži'}</button></div></div>`).join('')}
 <h2 style="margin-top:28px">Recenzije<span class="badge">${recenzije.length}</span></h2>
 ${recenzije.length?recenzije.map(r=>recKartica(r,r.mid,DO.filter(d=>d.mid===r.mid&&d.ruid===r.uid).length,r.uid)).join(''):'<div class="empty">Još nema recenzija.</div>'}
 ${odb.length?`<h2 style="margin-top:28px">Odbijene prijave<span class="badge">${odb.length}</span></h2>${odb.map(p=>prijavaKartica(p,true)).join('')}`:''}
 </main>`;if(nav)scrollTo(0,0)}

function izmeniForma(naslov,d,sacuvaj){
 sh.innerHTML=`<h3 id="sheetTitle">${esc(naslov)}</h3>${poljaHtml(d)}<div class="err" id="err"></div><button class="btn yellow" id="save">Sačuvaj</button>`;
 const procitaj=poveziPolja(d),err=document.getElementById('err'),save=document.getElementById('save');
 save.onclick=async()=>{const [x,g]=procitaj(false);if(g){err.textContent=g;return}
  save.disabled=true;save.textContent='Čuvam…';
  try{await sacuvaj(x);zatvori();toast('Sačuvano.')}
  catch(e){console.error(e);err.textContent='Čuvanje nije uspelo. Probaj ponovo.';save.disabled=false;save.textContent='Sačuvaj'}};
 document.body.classList.add('open')}

const pokusaj=async(f,ok)=>{try{await f();if(ok)toast(ok)}catch(e){console.error(e);toast('Nije uspelo. Proveri internet vezu i probaj ponovo.')}};
const adm={
 izmeniPrijavu(uid){const p=PR.find(x=>x.uid===uid);if(!p)return;
  izmeniForma('Izmena prijave',p,x=>updateDoc(doc(db,'prijave',uid),x))},
 odobri(uid){const p=PR.find(x=>x.uid===uid);if(!p)return;
  if(!p.telefon){toast('Prijava nema broj telefona.');return}
  if(!confirm(`Odobriti: ${p.ime}?\nPojaviće se u aplikaciji sa brojem ${p.telefon}.`))return;
  const b=writeBatch(db),mid='u_'+uid;
  b.set(doc(db,'majstori',mid),{ime:p.ime,kategorija:p.kategorija,mesta:p.mesta,iskustvo:p.iskustvo,opis:p.opis,telefon:p.telefon,aktivan:true,prijava:uid});
  b.update(doc(db,'prijave',uid),{status:'odobren',majstor:mid});
  pokusaj(()=>b.commit(),`${p.ime} je odobren i vidi se u aplikaciji.`)},
 odbij(uid){const p=PR.find(x=>x.uid===uid);if(!p||!confirm(`Odbiti prijavu: ${p.ime}?`))return;
  pokusaj(()=>updateDoc(doc(db,'prijave',uid),{status:'odbijen'}),'Prijava je odbijena.')},
 vratiPrijavu(uid){pokusaj(()=>updateDoc(doc(db,'prijave',uid),{status:'na_cekanju'}),'Prijava je vraćena na čekanje.')},
 obrisiPrijavu(uid){if(!confirm('Trajno obrisati ovu prijavu?'))return;
  pokusaj(()=>deleteDoc(doc(db,'prijave',uid)),'Prijava je obrisana.')},
 izmeniMajstora(id){const m=AM.find(x=>x.id===id);if(!m)return;
  izmeniForma('Izmena: '+m.n,{ime:m.n,telefon:m.t,kategorija:m.k,mesta:m.r,iskustvo:m.g,opis:m.o},x=>updateDoc(doc(db,'majstori',id),x))},
 prikazi(id,vidljiv){pokusaj(()=>updateDoc(doc(db,'majstori',id),{aktivan:vidljiv}),vidljiv?'Majstor se ponovo vidi u aplikaciji.':'Majstor je sakriven.')},
 // Briše recenziju zajedno sa njenim dojavama (Firestore ih ne briše sam)
 obrisiRecenziju(mid,uid){if(!confirm('Trajno obrisati ovu recenziju?'))return;
  const b=writeBatch(db);
  if(uid)b.delete(doc(db,'majstori',mid,'ocene',uid));
  DO.filter(d=>d.mid===mid&&d.ruid===uid).forEach(d=>b.delete(d.ref));
  pokusaj(()=>b.commit(),'Recenzija je obrisana.')},
 uRedu(mid,uid){const b=writeBatch(db);
  DO.filter(d=>d.mid===mid&&d.ruid===uid).forEach(d=>b.delete(d.ref));
  pokusaj(()=>b.commit(),'Prijava je skinuta, recenzija ostaje.')}
};

async function prijaviKomentar(mid,ruid){
 if(!user&&!(await prijava()))return;
 if(ruid===user.uid)return;
 if(!confirm('Prijaviti ovaj komentar administratoru kao neprimeren ili lažan?'))return;
 try{await setDoc(doc(db,'majstori',mid,'ocene',ruid,'dojave',user.uid),{uid:user.uid,vreme:serverTimestamp()});
  toast('Hvala! Komentar je prijavljen administratoru.')}
 catch(e){console.error(e);toast(e.code==='permission-denied'?'Već si prijavio ovaj komentar.':'Prijava nije uspela. Probaj ponovo.')}}

function zatvori(){document.body.classList.remove('open')}
document.getElementById('sheetBg').onclick=zatvori;
document.addEventListener('keydown',e=>{if(e.key==='Escape')zatvori()});

function prikazi(nav){const h=location.hash;let p;
 if(h.startsWith('#/admin'))admin(nav);
 else if((p=h.match(/^#\/k\/(\w+)/)))kategorija(p[1],nav);
 else if((p=h.match(/^#\/m\/([\w-]+)/)))profil(p[1],nav);
 else home()}
// Osvežava ekran kad stignu novi podaci, bez skrolovanja i bez gubljenja fokusa u pretrazi
function osvezi(){const a=document.activeElement,uQ=a&&a.id==='q',pos=uQ?a.selectionStart:0;
 prikazi(false);
 if(uQ){const n=document.getElementById('q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}}

// Funkcije koje se pozivaju iz onclick="..." moraju biti globalne
Object.assign(window,{pozovi,oceni,prijava,odjava,ubaci,upisSe,adm,prijaviKomentar,toast});
addEventListener('hashchange',()=>{zatvori();prikazi(true)});
prikazi(true);
