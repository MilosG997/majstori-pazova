# Netlify podešavanja (imaju prednost nad podešavanjima u Netlify UI)
[build]
  # Kopira samo fajlove sajta u dist/, da node_modules, firestore.rules i ostalo ne budu objavljeni
  command = "npm run pripremi"
  publish = "dist"

[build.environment]
  # "Pametna" provera je javni Firebase web ključ (AIza..., namerno vidljiv u sajtu) proglasila tajnom.
  # Gasi se samo ta provera; tajne promenljive (FIREBASE_SERVICE_ACCOUNT) Netlify i dalje proverava.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBHneYMR4ycYX-TMrVJlZKivhDC720GuuA"

# Lokalno (netlify dev): služi fajlove direktno iz projekta, da se izmene odmah vide
[dev]
  framework = "#static"
  publish = "."
  port = 8888

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # firebase-admin se ne pakuje u jedan fajl (ima svoje dodatne fajlove)
  external_node_modules = ["firebase-admin"]
